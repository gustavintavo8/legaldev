# Catálogo de identificadores de controles y medidas (RNF-17). Sirve para validar
# data/mapeo_controles.yaml (PP-09): todo identificador de la tabla debe existir aquí.
#
# NOTA SOBRE DERECHOS
# - ISO/IEC 27001:2022 es una norma de pago con derechos de autor de ISO/IEC: este fichero NO
#   reproduce el texto del Anexo A (ni sus títulos traducidos); solo guarda el identificador y
#   una paráfrasis propia de su objeto, escrita sin partir del enunciado del control y
#   suficiente para revisar el mapeo.
# - Las medidas del ENS salen del Anexo II del Real Decreto 311/2022 (BOE-A-2022-7191). Como
#   disposición reglamentaria no es objeto de propiedad intelectual (art. 13 LPI), y el BOE
#   permite reutilizarla citando la fuente, así que su nombre puede copiarse literalmente con
#   la atribución «Fuente de los datos: Agencia Estatal Boletín Oficial del Estado»
#   (https://www.boe.es). Si se toma del texto consolidado, hay que indicar que es un texto
#   consolidado de carácter meramente informativo.
#
# TODO(PT3/RNF-17): completar el catálogo. ISO/IEC 27001:2022: los 93 controles (A.5.1 a
# A.5.37, A.6.1 a A.6.8, A.7.1 a A.7.14, A.8.1 a A.8.34) con paráfrasis propia, comprobados
# contra un ejemplar legítimo de la norma. ENS: todas las medidas del Anexo II; pueden
# extraerse de la tabla «org.1 Política de seguridad / op.pl.1 Análisis de riesgos /
# mp.info.1 Datos personales...» del texto del BOE que ya está en el corpus.
#
# Esqueleto: solo los identificadores de los tres ejemplos comentados de
# data/mapeo_controles.yaml, que reproducen lst:det-mapeo (A.8.11, A.8.13, A.8.24, mp.com.2,
# mp.info.6 y mp.si.2) y dos filas de tab:det-mapeo-ejemplo (A.5.34 y mp.info.1; A.5.31), en
# 23-detalle.tex.

version: "0.0.0"

iso27001:
  A.5.31: "Tener localizadas y al día las exigencias legales y contractuales que afectan a la seguridad, y cómo se atienden (paráfrasis propia)"
  A.5.34: "Privacidad y datos personales: atender lo que exigen las leyes y los contratos aplicables (paráfrasis propia)"
  A.8.11: "Ocultar u ofuscar los datos (seudonimizar, anonimizar) cuando quien los usa no necesita verlos en claro (paráfrasis propia)"
  A.8.13: "Hacer copias de respaldo y comprobar periódicamente que se pueden restaurar (paráfrasis propia)"
  A.8.24: "Cifrado: cuándo emplearlo, con qué criterios y cómo se custodian las claves (paráfrasis propia)"

ens:
  mp.com.2: "Protección de la confidencialidad"
  mp.info.1: "Datos personales"
  mp.info.6: "Copias de seguridad"
  mp.si.2: "Criptografía"
