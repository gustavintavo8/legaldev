[project]
name = "legaldev"
version = "0.5.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi~=0.136.1",
    "uvicorn[standard]~=0.46.0",
    "langchain-core~=1.4.0",
    "langchain-chroma~=1.1.0",
    "langchain-groq~=1.1.2",
    "langchain-text-splitters~=1.1.2",
    "langchain-huggingface~=1.2.2",
    "chromadb~=1.5.9",
    "torch>=2.0.0",
    "sentence-transformers~=5.4.1",
    "pypdf~=6.10.2",
    "python-dotenv~=1.2.2",
    "pydantic~=2.13.4",
    "pydantic-settings~=2.14.1",
    "httpx~=0.28.1",
    "slowapi~=0.1.9",
    "prometheus-fastapi-instrumentator~=7.1.0",
    # SDK oficial de MCP; 2.3.0 sirve la revisión 2026-07-28 y la era de initialize (PT2).
    "mcp==2.3.0",
]
# Dependencias futuras del TFG (no se añaden hasta que el código las use; uv.lock no cambia):
# TODO(PT3/RF-26): "pyyaml~=6.0" explícita para data/*.yaml (hoy llega transitivamente vía
#   langchain-core y huggingface-hub; tools/eval_retrieval.py ya lo importa).
# TODO(PT3/PP-10): "jsonschema~=4.26" explícita para validar data/evidence.schema.json (hoy
#   llega transitivamente vía chromadb).

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "ruff>=0.4",
    "fpdf2>=2.8",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: marks tests as slow (deselect with '-m not slow')"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

# Oráculo de PP-18 (tests/_pp18.py, docs/mcp/pp18/oraculo.py): markdown-it-py con linkify.
# Grupo de uv, que `uv sync` instala por defecto (también con --extra dev, como en CI).
[dependency-groups]
dev = [
    "linkify-it-py>=2.2.0",
    "markdown-it-py>=4.2.0",
]
